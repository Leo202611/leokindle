name: Render Kindle Dashboard

on:
  schedule:
    # 每小时跑一次（UTC 的第 17 分）。生成未来 26 小时、按整点命名的图，
    # Kindle 按本地时间挑对应那张下载，因此时钟始终精确到小时。
    # GitHub 公共仓库 Actions 完全免费、无分钟数限制，所以可以放心每小时跑。
    - cron: "17 * * * *"
  workflow_dispatch:   # 允许手动点一次立刻生成
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "kindle-dash"
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list 2>/dev/null | grep -i "noto.*cjk" | head -3 || echo "(fc-list 不可用，继续)"

      - name: 安装依赖
        run: pip install -q -r requirements.txt

      # 【2026-11-07 恢复 · 2026-11-11.2 回退本地叠加方案后沿用】底栏中央显示 Kindle 电量。
      # 设备端 ss_update_once.sh 在每小时整点取图时 WiFi 已开，顺手把 battLevel/isCharging
      # POST 到 ntfy（零额外唤醒），CI 读回后把电量烧进 PNG 底栏中央，故挂起后仍保留。
      # batt_relay.py 优先取 2h 内上报；若无新鲜值则退回最近一次已知值（绝不无故留白）。
      # 数值约滞后 1 小时，但电量是慢变量(约 0.3%/小时)，整数显示下误差 <1%。
      - name: 读取设备上报的真实电量（云端中转）
        run: python3 batt_relay.py >> "$GITHUB_ENV"

      - name: 批量渲染逐小时图（竖屏 + 横屏两套）
        env:
          SS_SLOT_MINUTES: "0"
        run: |
          mkdir -p out
          ARGS="--hours 26 --outdir out --landscape"
          if [ -n "$DASH_BATT" ]; then
            ARGS="$ARGS --batt $DASH_BATT"
          fi
          if [ "$DASH_CHARGING" = "1" ]; then
            ARGS="$ARGS --charging"
          fi
          echo "渲染参数: $ARGS（DASH_BATT=${DASH_BATT:-空} DASH_CHARGING=${DASH_CHARGING:-0}）"
          python3 render.py $ARGS
          echo "---- 产物 ----"
          ls -l out | head -8
          cat out/index.txt | head -3
          echo "..."
          cat out/index.txt | tail -2
          echo "---- 电量槽元数据 ----"
          cat out/batt_pos.txt

      - name: 生成 6/9/12/15/18 固定槽位待机图
        run: |
          python3 make_slots.py out
          echo "---- 槽位映射 ----"
          cat out/slots.txt
          ls -l out/ss_*.png
          python3 - <<'PY'
          from PIL import Image
          import glob
          for p in sorted(glob.glob("out/ss_*.png")):
              im = Image.open(p)
              assert im.size == (600, 800) and im.mode == "L", (p, im.size, im.mode)
              print("OK", p, im.size, im.mode)
          PY

      - name: 配置 Pages（未开通时会自动开通）
        id: pages_conf
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: out

      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 同步到 dash 分支（jsDelivr 备用通道）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dash_tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp out/*.png out/index.txt out/batt_pos.txt out/slots.txt .
          git add -f *.png index.txt batt_pos.txt slots.txt
          git commit -m "dash $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push -f origin dash_tmp:dash

      - name: 汇总
        run: |
          echo "Pages URL: ${{ steps.deployment.outputs.page_url }}"
          echo "主通道: ${{ steps.deployment.outputs.page_url }}/$(head -1 out/index.txt)"
          echo "备用通道: https://gcore.jsdelivr.net/gh/Leo202611/leokindle@dash/$(head -1 out/index.txt)"
          echo "待机槽位图: https://gcore.jsdelivr.net/gh/Leo202611/leokindle@dash/ss_09.png"
