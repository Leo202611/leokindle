name: Render Kindle Dashboard

on:
  schedule:
    # 每小时跑一次（UTC 的第 17 分）。生成未来 26 小时、按整点命名的图，
    # Kindle 按本地时间挑对应那张下载，因此时钟始终精确到小时。
    # GitHub 公共仓库 Actions 完全免费、无分钟数限制，所以可以放心每小时跑。
    - cron: "17 * * * *"
  workflow_dispatch:   # 允许手动点一次立刻生成
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "kindle-dash"
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list 2>/dev/null | grep -i "noto.*cjk" | head -3 || echo "(fc-list 不可用，继续)"

      - name: 安装依赖
        run: pip install -q -r requirements.txt

      - name: 批量渲染逐小时图
        run: |
          mkdir -p out
          python3 render.py --hours 26 --outdir out
          echo "---- 产物 ----"
          ls -l out | head -8
          cat out/index.txt | head -3
          echo "..."
          cat out/index.txt | tail -2

      - name: 配置 Pages（未开通时会自动开通）
        id: pages_conf
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: out

      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 同步到 dash 分支（jsDelivr 备用通道）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dash_tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp out/*.png out/index.txt .
          git add -f *.png index.txt
          git commit -m "dash $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push -f origin dash_tmp:dash

      - name: 汇总
        run: |
          echo "Pages URL: ${{ steps.deployment.outputs.page_url }}"
          echo "主通道: ${{ steps.deployment.outputs.page_url }}/$(head -1 out/index.txt)"
          echo "备用通道: https://gcore.jsdelivr.net/gh/Leo202611/leokindle@dash/$(head -1 out/index.txt)"
